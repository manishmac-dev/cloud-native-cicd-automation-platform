events {
    worker_connections 1024;
}

http {
    # Upstream definitions pointing to internal service DNS names
    upstream user_service {
        server user-service:8001;
    }

    upstream order_service {
        server order-service:8002;
    }

    upstream payment_service {
        server payment-service:8003;
    }

    server {
        listen 80;
        server_name localhost;

        # Gateway Health Check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"nginx-api-gateway"}';
            add_header Content-Type application/json;
        }

        # Route User Service Requests
        location /api/v1/users {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route Order Service Requests
        location /api/v1/orders {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route Payment Service Requests
        location /api/v1/payments {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}