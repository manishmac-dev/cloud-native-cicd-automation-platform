services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # 2. User Microservice
  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    environment:
      SERVICE_NAME: user-service
      SERVICE_VERSION: 1.0.0
      DATABASE_URL: postgresql://admin:adminpassword@postgres-db:5432/user_db
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - microservices-net

  # 3. Order Microservice
  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    environment:
      SERVICE_NAME: order-service
      SERVICE_VERSION: 1.0.0
      DATABASE_URL: postgresql://admin:adminpassword@postgres-db:5432/order_db
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - microservices-net

  # 4. Payment Microservice
  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    environment:
      SERVICE_NAME: payment-service
      SERVICE_VERSION: 1.0.0
      DATABASE_URL: postgresql://admin:adminpassword@postgres-db:5432/payment_db
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - microservices-net

  # 5. Nginx API Gateway (Single Entry Point)
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - order-service
      - payment-service
    networks:
      - microservices-net

volumes:
  postgres_data:

networks:
  microservices-net:
    driver: bridge